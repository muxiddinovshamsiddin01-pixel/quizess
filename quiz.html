<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — StudyQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/quiz.css?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  /* Quiz page has no sidebar */
  :root { --sidebar-w: 0px; }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
  onload="window._katexLoaded=true; tryInitQuiz();"></script>
</head>
<body>
<div class="bg-orbs"></div>

<!-- Progress header -->
<header class="progress-header">
  <div class="progress-top">
    <button class="btn-next" onclick="goBack()" style="padding:8px 18px;font-size:13px;">
      <svg class="arr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Back</span>
    </button>
    <span class="progress-label" id="progLabel">Question 1 / …</span>
    <div class="progress-counters">
      <span class="pctr ok">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <b id="progOk">0</b>
      </span>
      <span class="pctr err">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <b id="progErr">0</b>
      </span>
    </div>
  </div>
  <div class="prog-bar" style="height:4px;background:var(--bg3);border-radius:100px;overflow:hidden;">
    <div id="progFill" style="height:100%;width:0%;background:linear-gradient(90deg,var(--pk),var(--cy));border-radius:100px;transition:width .3s ease;"></div>
  </div>
</header>

<!-- Main content -->
<div class="quiz-page">
  <div id="questionArea"></div>

  <!-- Done screen -->
  <div class="done-screen" id="doneScreen">

    <!-- Header -->
    <div class="done-header">
      <div class="done-emoji" id="doneEmoji">🎉</div>
      <div class="done-title" id="doneTitle">Quiz Complete!</div>
      <div class="done-subtitle" id="doneSub"></div>
    </div>

    <!-- Score ring + main stats -->
    <div class="done-hero">
      <div class="done-ring-wrap">
        <svg class="done-ring" viewBox="0 0 120 120">
          <circle class="ring-bg"    cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
          <circle class="ring-fill"  cx="60" cy="60" r="52" fill="none" stroke-width="10"
                  stroke-linecap="round"
                  id="ringFill"
                  stroke-dasharray="326.7"
                  stroke-dashoffset="326.7"
                  transform="rotate(-90 60 60)"/>
        </svg>
        <div class="done-ring-label">
          <div class="done-pct" id="doneScore">0%</div>
          <div class="done-pct-sub">score</div>
        </div>
      </div>

      <div class="done-stats-col">
        <div class="done-stat done-stat--ok">
          <div class="done-stat-val" id="doneCorrect">0</div>
          <div class="done-stat-key">CORRECT</div>
        </div>
        <div class="done-stat done-stat--err">
          <div class="done-stat-val" id="doneWrong">0</div>
          <div class="done-stat-key">WRONG</div>
        </div>
        <div class="done-stat done-stat--neu">
          <div class="done-stat-val" id="doneTotal">0</div>
          <div class="done-stat-key">TOTAL</div>
        </div>
        <div class="done-stat done-stat--time">
          <div class="done-stat-val" id="doneTime">0s</div>
          <div class="done-stat-key">TIME</div>
        </div>
      </div>
    </div>

    <!-- Grade badge -->
    <div class="done-grade-wrap">
      <div class="done-grade" id="doneGrade"></div>
    </div>

    <!-- Action buttons -->
    <div class="done-actions">
      <button class="done-btn done-btn--primary" onclick="restart()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.35"/></svg>
        Try Again
      </button>
      <button id="retryMistakesBtn" onclick="retryMistakes()" style="display:none" class="done-btn done-btn--danger">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        Retry Mistakes
        <span class="mistakes-count" id="mistakesCountBadge">0</span>
      </button>
      <button onclick="goBack()" class="done-btn done-btn--ghost">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
    </div>

    <!-- Mistakes list -->
    <div id="mistakesSection"></div>

  </div>
</div>

<!-- ══ Exit Quiz Confirm Modal ══ -->
<div class="fb-modal-wrap" id="exitConfirmModal" style="display:none;align-items:center;justify-content:center;" onclick="if(event.target===this)closeExitModal()">
  <div class="fb-modal" style="max-width:380px;padding:32px 28px;text-align:center;">
    <div style="font-size:36px;margin-bottom:12px;">⚠️</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text1)">Exit quiz?</div>
    <div style="font-size:14px;color:var(--text3);margin-bottom:24px;line-height:1.5">
      Progress will be saved and you can continue later from the "Unsolved Questions" section.
    </div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button onclick="closeExitModal()" class="done-btn done-btn--ghost" style="flex:1">
        Continue
      </button>
      <button onclick="confirmExit()" class="done-btn done-btn--danger" style="flex:1">
        Exit
      </button>
    </div>
  </div>
</div>

<!-- Modal explanation -->
<div class="fb-modal-wrap" id="fbModalWrap" onclick="if(event.target===this)closeHintPanel()">
  <div class="fb-modal" id="fbModal">
    <div class="fb-modal-header">
      <div class="fb-modal-title" id="fbPanelTitle"></div>
      <button class="fb-modal-close" onclick="closeHintPanel()">✕</button>
    </div>
    <div class="fb-modal-correct-label" id="fbCorrectLabel"></div>
    <div class="fb-modal-body" id="fbPanelBody"></div>
  </div>
</div>

<!-- AI Review Modal -->
<div class="ai-review-wrap" id="aiReviewModal" onclick="if(event.target===this)closeAiReviewModal()">
  <div class="ai-review-modal">
    <div class="ai-review-header">
      <div class="ai-review-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><path d="M22 6l-3 3-3-3"/></svg>
        AI Answer Review
      </div>
      <button class="fb-modal-close" onclick="closeAiReviewModal()">✕</button>
    </div>
    <div class="ai-review-body" id="aiReviewBody"></div>
    <div class="ai-review-footer">
      <button class="ai-retry-btn" id="aiRetryBtn" onclick="retryOpenAnswer()" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Try Again
      </button>
      <button class="btn-next" id="aiGotItBtn" onclick="closeAiReviewModal()">
        Got it
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar" id="bottomBar">
  <div class="bottom-stats">
    <div class="bstat">
      <div class="bstat-val ok" id="bstatOk">0</div>
      <div class="bstat-label">CORRECT</div>
    </div>
    <div class="bstat">
      <div class="bstat-val err" id="bstatErr">0</div>
      <div class="bstat-label">WRONG</div>
    </div>
  </div>
  <div class="hotkeys">
    Keys 1–4 / A–D to answer · E = explanation · Esc = close
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="btn-prev" id="btnPrev" onclick="prevQuestion()">
      <svg class="arr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Back</span>
    </button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled>
      <span>Next</span>
      <svg class="arr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</div>

<!-- Scripts -->
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/physics_questions.js"></script>
<script src="js/linalg2_questions.js"></script>
<script src="js/drawing_questions.js"></script>
<script src="js/fundamental_questions.js"></script>
<script src="js/api.js"></script>

<script>
requireAuth();
window._katexLoaded = false;
window._quizInitialized = false;

// Route questions to window.QUESTIONS_DATA based on subject param
(function() {
  const subject = new URLSearchParams(location.search).get('subject') || 'physics';
  if (subject === 'linalg') {
    window.QUESTIONS_DATA = window.LA2_QUESTIONS || [];
  } else if (subject === 'mathanalysis') {
    window.QUESTIONS_DATA = (typeof MA2_QUESTIONS !== 'undefined') ? MA2_QUESTIONS : [];
  } else if (subject === 'drawing') {
    window.QUESTIONS_DATA = window.DRAWING_QUESTIONS || [];
  } else if (subject === 'fundamental') {
    window.QUESTIONS_DATA = window.FUNDAMENTAL_QUESTIONS || [];
  }
  // physics: QUESTIONS_DATA already set by physics_questions.js
})();

function tryInitQuiz() {
  if (window._katexLoaded && window.QUESTIONS_DATA && window.QUESTIONS_DATA.length > 0 && !window._quizInitialized) {
    window._quizInitialized = true;
    initQuiz();
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // physics_questions.js is synchronous, so QUESTIONS_DATA is ready
  // Just need KaTeX. If already loaded (cache), fire now.
  if (window._katexLoaded) tryInitQuiz();
  // Fallback: if CDN blocked or slow
  setTimeout(function() {
    if (!window._quizInitialized) {
      window._katexLoaded = true;
      tryInitQuiz();
    }
  }, 3000);
});

// Called by quiz.js for renderMathInPage compatibility
function renderMathInPage() {
  window._katexLoaded = true;
  tryInitQuiz();
}
</script>

<script src="js/quiz.js"></script>
</body>
</html>
